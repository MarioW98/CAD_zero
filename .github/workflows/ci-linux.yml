name: ci-linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      # fail-fast: false — one red job must NOT cancel the others:
      # the matrix IS the diagnosis tool (a preset-only failure points
      # at that compiler immediately). See the Toolchain contract in
      # docs/audits/2026-10-13-warning-audit.md.
      fail-fast: false
      matrix:
        preset: [linux-gcc-debug, linux-gcc-release, linux-clang]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ clang python3 python3-pip python3-venv \
            xvfb libegl1 libgl1-mesa-dri libglx-mesa0

      # Toolchain contract (docs/audits/2026-10-13-warning-audit.md):
      # print the ACTUAL compilers of this runner in every job — the
      # warning audit and every -Werror change must be reproduced with
      # these (ubuntu-22.04 default: g++ 11.4 / clang 14) BEFORE push,
      # locally via the linux-gcc11-ci preset.
      - name: Compiler versions
        run: |
          g++ --version
          clang++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Bug 3 regression guard + native-format round-trip tests.
      # Needs only numpy + pytest — UI-import checks skip gracefully
      # without PySide6.
      # linux-gcc-debug links ASan into the extension module
      # (CAD_0_SANITIZE=ON): a plain `python3` cannot import it
      # ("ASan runtime does not come first in initial library list")
      # and preloading libasan is fragile. ASan coverage for the same
      # C++ code paths is provided by the ctest doctest suite above.
      - name: Python bindings tests
        if: matrix.preset != 'linux-gcc-debug'
        run: |
          python3 -m pip install --user numpy pytest PySide6 PyOpenGL
          PYTHONPATH=build/${{ matrix.preset }}/python \
            python3 bindings/python/tests/test_bug_fixes.py
          PYTHONPATH=build/${{ matrix.preset }}/python \
            python3 -m pytest bindings/python/tests -q

      # UI smoke tests (BUG 1 invisible menubar + BUG 2 dead viewport
      # navigation + maximized startup): the camera-steering assertions
      # need a real GL context, which the offscreen QPA creates through
      # EGL — and Mesa can only open EGL with a display around, so the
      # run happens under Xvfb exactly like the Codespaces app (see
      # CODESPACES.md). The startup test shows a real window (in its own
      # subprocess, exiting via os._exit before Qt/GL teardown).
      # Fresh pytest process on purpose: the combined run above reuses a
      # QApplication created on the "minimal" platform, which has no GL
      # and would make these tests skip.
      - name: UI smoke tests (GL)
        if: matrix.preset != 'linux-gcc-debug'
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac &
          export DISPLAY=:99
          export QT_QPA_PLATFORM=offscreen
          PYTHONPATH=build/${{ matrix.preset }}/python \
            python3 -m pytest bindings/python/tests/test_ui_navigation.py \
              bindings/python/tests/test_ui_startup.py -v

      # Python package (CAD_0 module: nanobind bindings + UI) from every
      # matrix job. Low retention to keep storage costs down.
      - name: Upload Python package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/python
          retention-days: 7

      # ctest logs (Testing/LastTest.log, Testing/CTestCostData.txt) —
      # only needed when something failed.
      - name: Upload ctest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing
