name: ci-linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Commit subject lint — la regola dei soggetti descrittivi
  # (scripts/check_commit_subject.py). Giudica SOLO i commit del range
  # pushato / del PR: la storia pre-lint non si tocca. Skip dei merge
  # (subject generato da git/GitHub, non scelto dall'autore).
  subject-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # serve l'intera storia: il range pushato può includere
          # commit più vecchi della shallow clone di default
          fetch-depth: 0

      - name: Commit subject lint (range dei commit pushati)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}"   # nuovo ramo: solo la punta
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          # force-push che ha cancellato "before": fallback alla punta
          if ! git cat-file -e "${RANGE%%..*}^{commit}" 2>/dev/null; then
            echo "::warning::range non risolvibile (${RANGE}), fallback al singolo commit"
            RANGE="${{ github.sha }}"
          fi
          python3 scripts/check_commit_subject.py "$RANGE"

  # Python 3.10 syntax floor (Consegna B m1). The 22.04 runner's system
  # Python WAS this gate: every test module was imported by a real 3.10
  # interpreter before it ever ran. The 24.04 image ships Python 3.12,
  # so the floor gets its own job instead of riding the runner's
  # default — a gate that silently disappears is a lie of omission.
  # Byte-compilation parses EVERY .py under the 3.10 grammar: this is
  # the same protection the old runner gave (syntax-level), kept
  # explicit. The runtime-level 3.10 gate (tests executing on 3.10)
  # retired with 22.04 and is registered in
  # docs/audits/2026-11-01-ci-runner-asan-and-attestations.md.
  python-3-10-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Byte-compile the tree under the 3.10 grammar
        run: |
          python --version
          python -m compileall -q app bindings examples scripts tests

  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      # fail-fast: false — one red job must NOT cancel the others:
      # the matrix IS the diagnosis tool (a preset-only failure points
      # at that compiler immediately). See the Toolchain contract in
      # docs/audits/2026-10-13-warning-audit.md (2026-11-01 update:
      # ubuntu-24.04, gcc 14 + clang 19 columns).
      fail-fast: false
      matrix:
        # The two toolchain columns, pinned by the presets themselves
        # (CMakePresets.json): gcc 14 (debug+ASan/UBSan, release) and
        # clang 19 — the same series as the local rite. The CI is
        # never OLDER than the rite, only ever the other way around.
        preset: [linux-gcc-debug, linux-gcc-release, linux-clang]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          # The toolchain columns, explicit: the 24.04 image ships
          # g++-14 but its default clang is 18 — clang 19 comes from
          # noble-updates (the image does not preinstall it). The
          # presets pin g++-14 / clang++-19, so both must be present.
          sudo apt-get install -y ninja-build cmake g++-14 clang-19 \
            python3 python3-pip python3-venv \
            xvfb libegl1 libgl1-mesa-dri libglx-mesa0

      # Python test deps BEFORE ctest: the Python bindings suite is a
      # ctest member (CAD_0_python_bindings) in every job of this
      # matrix — the pip layer must exist when ctest runs. The old
      # bare "Python bindings tests" step is gone: its two commands
      # live inside the ctest target now, under the same preset that
      # builds the module, and in the ASan build they run WITH the
      # sanitizer preloaded (the gap the H1 report had declared).
      - name: Python test dependencies
        run: |
          python3 -m pip install --user numpy pytest PySide6 PyOpenGL

      # Toolchain contract (docs/audits/2026-10-13-warning-audit.md,
      # 2026-11-01 update): print the ACTUAL column compilers in every
      # job — ubuntu-24.04: g++-14 14.2 / clang++-19 19.1. Every
      # -Werror change and every warning hunt must be reproduced with
      # these before push, locally via the same pinned presets.
      - name: Compiler versions
        run: |
          g++-14 --version
          clang++-19 --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # CAD_0_tests (C++ doctest suite, -Werror) + CAD_0_python_bindings
      # (the bindings suite — plain in release/clang, UNDER ASan in the
      # debug column via the preloaded libasan).
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # UI smoke tests (BUG 1 invisible menubar + BUG 2 dead viewport
      # navigation + maximized startup): the camera-steering assertions
      # need a real GL context, which the offscreen QPA creates through
      # EGL — and Mesa can only open EGL with a display around, so the
      # run happens under Xvfb exactly like the Codespaces app (see
      # CODESPACES.md). The startup test shows a real window (in its own
      # subprocess, exiting via os._exit before Qt/GL teardown).
      # Fresh pytest process on purpose. These two GL-bound files are
      # the ones the ctest bindings target ignores (a display is their
      # prerequisite, not a sanitizer).
      - name: UI smoke tests (GL)
        if: matrix.preset != 'linux-gcc-debug'
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac &
          export DISPLAY=:99
          export QT_QPA_PLATFORM=offscreen
          PYTHONPATH=build/${{ matrix.preset }}/python \
            python3 -m pytest bindings/python/tests/test_ui_navigation.py \
              bindings/python/tests/test_ui_startup.py -v

      # Python package (CAD_0 module: nanobind bindings + UI) from every
      # matrix job. Low retention to keep storage costs down.
      - name: Upload Python package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/python
          retention-days: 7

      # ctest logs (Testing/LastTest.log, Testing/CTestCostData.txt) —
      # only needed when something failed.
      - name: Upload ctest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing
