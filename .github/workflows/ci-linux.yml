name: ci-linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        preset: [linux-gcc-debug, linux-gcc-release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ python3 python3-pip python3-venv

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Bug 3 regression guard + native-format round-trip tests.
      # Needs only numpy + pytest — UI-import checks skip gracefully
      # without PySide6.
      - name: Python bindings tests
        run: |
          python3 -m pip install --user numpy pytest
          PYTHONPATH=build/${{ matrix.preset }}/python \
            python3 bindings/python/tests/test_bug_fixes.py
          PYTHONPATH=build/${{ matrix.preset }}/python \
            python3 -m pytest bindings/python/tests -q
