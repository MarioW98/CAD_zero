[build-system]
requires = ["scikit-build-core>=0.10.0", "nanobind>=2.2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "CAD_0"
version = "0.1.0"
description = "CAD_0 — dual-representation CAD kernel (native SDF + B-Rep)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CAD_0 contributors" }]
keywords = ["cad", "sdf", "brep", "geometry", "implicit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    # Linux only: the CI matrix (ci-linux.yml) testifies Linux; Windows
    # is a registered unit, not a tested platform — no classifier may
    # claim what the CI does not testify (see
    # docs/audits/2026-11-01-ci-runner-asan-and-attestations.md).
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# Bug 5 fix: PyOpenGL was missing from the `ui` extra. The viewport widget
# (app/src/CAD_0/ui/viewport_widget.py) hard-imports `OpenGL.GL`, so
# `pip install CAD_0[ui]` alone left the app crashing at startup.
ui = ["PySide6>=6.6.0", "PyOpenGL>=3.1.0"]
cli = ["typer>=0.12.0", "rich>=13.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
]

[project.scripts]
# `main()`, not `app`: without typer (the [cli] extra) `app` is None,
# so a console script bound to it would die with a bare TypeError —
# `main()` instead prints the actionable "pip install CAD_0[cli]"
# message and exits 1. The base install stays a working library and
# tells the truth about the extra (Consegna B m2).
CAD_0 = "CAD_0.cli:main"

[tool.scikit-build]
# cmake.version (not the removed cmake.minimum-version — the key was
# deprecated in scikit-build-core 0.8 and dropped by 1.x; the floating
# build requirement resolves to 1.1.1 today). Works across the whole
# declared range (>=0.10.0): the venv-virgin proof is the tripwire.
cmake.version = ">=3.22"
ninja.make-fallback = true
cmake.args = [
    "-DCAD_0_BUILD_PYTHON=ON",
    "-DCAD_0_BUILD_TESTING=OFF",
]
# The wheel's content is NOT declared here: the CAD_0 package is
# assembled by CMake (bindings' Python surface + app UI + the
# compiled extension, staged into build/<preset>/python/CAD_0) and
# installed by bindings/python/CMakeLists.txt — scikit-build-core
# maps that install tree onto the wheel. Declaring the package a
# second time here (the old two-entry wheel.packages, two source
# dirs for one package) relied on a merge the current
# scikit-build-core (1.x) no longer performs: the wheel came out
# without the Python surface. One truth, assembled once
# (Consegna B m2, 2026-11-01).
wheel.packages = []

[tool.nanobind]
clang-version = "17"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["bindings/python/tests", "tests"]
addopts = "-ra -q"
